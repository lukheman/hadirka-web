<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sedang Dalam Pemeliharaan | PT. Triputra Jaya Sultra</title>
    <link rel="icon" type="image/x-icon" href="assets/img/logo/tjs-nobg.png" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Public Sans", "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d6efd 0%, #084298 60%, #031633 100%);
            color: #fff;
            padding: 24px;
        }
        .card {
            max-width: 560px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }
        .logo { max-width: 160px; margin-bottom: 24px; }
        .icon { font-size: 56px; margin-bottom: 16px; }
        h1 { font-size: 28px; margin-bottom: 12px; }
        p { font-size: 16px; line-height: 1.6; color: rgba(255, 255, 255, 0.85); }
        .divider {
            width: 64px;
            height: 4px;
            background: #ffc107;
            border-radius: 2px;
            margin: 24px auto;
        }
        .note { font-size: 14px; color: rgba(255, 255, 255, 0.65); margin-top: 16px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ffc107;
            border-radius: 50%;
            margin: 0 auto 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="assets/img/logo/tjs-nobg.png" alt="Logo PT. Triputra Jaya Sultra" onerror="this.style.display='none'" />
        <div class="spinner"></div>
        <h1>Website Sedang Dalam Pemeliharaan</h1>
        <div class="divider"></div>
        <p>
            Mohon maaf atas ketidaknyamanannya. Sistem sedang dalam masa
            pemeliharaan untuk meningkatkan kualitas layanan.
        </p>
        <p class="note">Silakan kembali lagi beberapa saat nanti. Terima kasih.</p>
    </div>
</body>
</html>
